services:
  backend:
    build: .
    container_name: sanctuary-backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - .env.docker

  db:
    image: mysql:8
    container_name: sanctuary-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sanctuary_protocol_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
